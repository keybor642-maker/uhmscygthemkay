name: Build ScythePlugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Paper API
        run: curl -L -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/1.21.4/builds/191/downloads/paper-1.21.4-191.jar"

      - name: Compile
        run: |
          mkdir -p out
          javac -cp paper.jar -d out $(find src -name "*.java")

      - name: Copy resources
        run: cp src/main/resources/plugin.yml out/

      - name: Build JAR
        run: cd out && jar cvf ../ScythePlugin.jar .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ScythePlugin
          path: ScythePlugin.jar
